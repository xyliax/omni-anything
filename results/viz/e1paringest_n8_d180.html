<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>run timeline</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #f9f9f7; color: #0b0b0b;
         font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
  #hdr { padding: 10px 16px 4px; }
  #hdr b { font-size: 15px; }
  #hdr .hint { color: #898781; margin-left: 12px; }
  .legend { display: inline-flex; gap: 14px; margin-left: 16px; vertical-align: middle; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; color: #52514e; }
  .sw { width: 14px; height: 9px; border-radius: 2px; display: inline-block; }
  #wrap { position: relative; margin: 6px 12px; }
  canvas { display: block; background: #fcfcfb; border: 1px solid #e1e0d9; border-radius: 6px; }
  #tip { position: absolute; pointer-events: none; background: #0b0b0b; color: #fff;
         padding: 5px 8px; border-radius: 5px; font-size: 12px; display: none;
         white-space: pre; z-index: 5; }
</style>

<body>
<div id="hdr">
  <b id="title"></b>
  <span class="legend">
    <span><i class="sw" style="background:#eb6834"></i>prefill+encoder</span>
    <span><i class="sw" style="background:#2a78d6"></i>decode</span>
    <span><i class="sw" style="background:#d03b3b"></i>eviction</span>
    <span><i class="sw" style="background:#e1e0d9"></i>KV pool</span>
    <span><i class="sw" style="background:#008300"></i>SM util</span>
  </span>
  <span class="hint">滚轮=缩放 · 拖拽=平移 · 双击=复位 · 概览条点击=跳转 · 悬停=详情</span>
</div>
<div id="wrap"><canvas id="cv"></canvas><div id="tip"></div></div>
<script>
const D = {"tag":"e1paringest_n8_d180","ticks":[0.0,0.01,0.02,0.03,2.25,2.26,2.27,2.28,2.29,2.3,2.33,2.36,4.01,6.0,6.01,8.0,8.01,10.0,10.01,12.0,12.01,14.0,14.01,14.02,14.03,16.01,16.02,18.01,18.02,20.0,20.01,22.01,22.02,24.0,24.01,24.02,26.01,26.02,28.01,28.02,30.01,32.01,32.02,34.01,34.02,36.01,36.02,38.01,38.02,40.01,40.02,42.01,42.02,42.03,44.02,44.03,46.01,46.02,48.01,48.02,50.01,50.02,50.03,52.01,52.02,52.03,54.01,54.02,56.01,56.02,58.02,60.01,60.02,62.02,62.03,64.02,64.03,66.02,66.03,68.02,68.03,68.04,70.02,72.02,72.03,74.02,74.03,76.02,76.03,78.02,78.03,80.02,80.03,82.02,82.03,84.03,86.03,86.04,88.03,88.04,90.02,90.03,90.04,92.03,92.04,94.03,94.04,96.03,96.04,98.03,98.04,100.03,100.04,102.03,102.04,102.05,104.03,104.04,106.03,108.03,110.03,110.04,110.05,112.03,112.04,114.03,114.04,116.03,116.04,118.03,118.04,118.05,120.03,120.04,122.03,122.04,124.03,124.04,126.03,126.04,128.03,128.04,128.05,130.04,132.03,132.04,134.04,136.04,136.05,138.03,138.04,138.05,138.06,138.07,140.04,140.05,142.04,142.05,144.04,146.04,146.05,148.04,148.05,150.04,150.05,150.06,152.04,152.05,154.04,154.05,156.04,156.05,156.06,158.04,158.05,160.04,160.05,160.06,162.04,162.05,164.04,164.05,164.06,166.04,166.05,166.06,168.04,168.05,168.06,170.04,170.05,170.06,172.04,172.05,172.06,174.04,174.05,176.05,176.06,178.05,178.06],"starve":{"8":124.6,"1":124.4,"2":124.6,"3":124.6,"4":124.5,"6":124.5,"7":124.6,"5":124.5},"kv":[[-16.55,0.056,1,0,0],[-15.35,0.081,1,0,0],[1.75,0.056,1,1,0],[2.95,0.084,2,5,0],[4.05,0.195,1,7,0],[5.35,0.279,1,7,0],[6.65,0.362,1,7,0],[8.05,0.446,1,7,0],[9.35,0.529,1,7,0],[10.65,0.613,1,7,0],[11.75,0.643,0,8,0],[12.75,0.677,7,0,0],[13.95,0.68,2,0,0],[16.05,0.688,5,0,0],[17.95,0.69,0,0,0],[20.05,0.7,6,0,0],[22.05,0.707,7,0,0],[24.05,0.712,7,0,0],[25.95,0.715,3,0,0],[28.05,0.724,7,0,0],[29.95,0.727,3,0,0],[31.95,0.731,2,0,0],[33.95,0.736,1,0,0],[35.95,0.743,2,0,0],[37.95,0.749,2,0,0],[39.95,0.754,1,0,0],[41.95,0.759,1,0,0],[43.95,0.766,2,0,0],[45.95,0.771,1,0,0],[47.95,0.781,6,0,0],[49.95,0.783,2,0,0],[51.85,0.788,0,0,0],[53.95,0.796,3,0,0],[55.95,0.802,4,0,0],[57.95,0.806,2,0,0],[59.95,0.812,3,0,0],[61.85,0.816,0,0,0],[63.95,0.825,4,0,0],[66.05,0.832,6,0,0],[67.95,0.837,5,0,0],[69.95,0.842,4,0,0],[72.05,0.849,6,0,0],[74.05,0.855,6,0,0],[76.05,0.862,7,0,0],[78.05,0.867,6,0,0],[80.05,0.872,6,0,0],[81.95,0.877,4,0,0],[84.05,0.883,5,0,0],[86.05,0.891,7,0,0],[88.05,0.896,7,0,0],[89.95,0.899,3,0,0],[91.95,0.906,5,0,0],[93.95,0.91,2,0,0],[95.95,0.918,5,0,0],[97.85,0.92,0,0,0],[99.85,0.926,0,0,0],[101.95,0.935,5,0,0],[103.95,0.94,4,0,0],[105.95,0.946,4,0,0],[107.95,0.95,2,0,0],[110.15,0.959,7,0,0],[112.05,0.965,7,0,0],[113.95,0.967,1,0,0],[115.95,0.975,5,0,0],[117.85,0.977,0,0,0],[119.95,0.985,2,0,0],[121.85,0.989,0,0,0],[123.85,0.995,1,0,0],[125.75,1.0,0,0,0],[126.75,1.0,0,0,0],[127.75,1.0,0,0,0],[128.75,1.0,0,0,0],[129.75,1.0,0,0,0],[130.75,1.0,0,0,0],[131.75,1.0,0,0,0],[132.75,1.0,0,0,0],[133.75,1.0,0,0,0],[134.75,1.0,0,0,0],[135.75,1.0,0,0,0],[136.75,1.0,0,0,0],[137.75,1.0,0,0,0],[138.75,1.0,0,0,0],[139.75,1.0,0,0,0],[140.75,1.0,0,0,0],[141.75,1.0,0,0,0],[142.75,1.0,0,0,0],[143.75,1.0,0,0,0],[144.75,1.0,0,0,0],[145.75,1.0,0,0,0],[146.75,1.0,0,0,0],[147.75,1.0,0,0,0],[148.75,1.0,0,0,0],[149.75,1.0,0,0,0],[150.75,1.0,0,0,0],[151.75,1.0,0,0,0],[152.75,1.0,0,0,0],[153.75,1.0,0,0,0],[154.75,1.0,0,0,0],[155.75,1.0,0,0,0],[156.75,1.0,0,0,0],[157.75,1.0,0,0,0],[158.75,1.0,0,0,0],[159.75,1.0,0,0,0],[160.75,1.0,0,0,0],[161.75,1.0,0,0,0],[162.75,1.0,0,0,0],[163.75,1.0,0,0,0],[164.75,1.0,0,0,0],[165.75,1.0,0,0,0],[166.75,1.0,0,0,0],[167.75,1.0,0,0,0],[168.75,1.0,0,0,0],[169.75,1.0,0,0,0],[170.75,1.0,0,0,0],[171.75,1.0,0,0,0],[172.75,1.0,0,0,0],[173.75,1.0,0,0,0],[174.75,1.0,0,0,0],[175.75,1.0,0,0,0],[176.75,1.0,0,0,0],[177.75,1.0,0,0,0],[178.75,1.0,0,0,0],[179.75,1.0,0,0,0]],"evictions":[],"smi":[[-2.5,0],[2.5,0],[7.5,0],[12.5,100],[17.5,100],[22.5,100],[27.5,0],[32.5,0],[37.5,0],[42.5,0],[47.5,0],[52.5,0],[57.5,0],[62.5,0],[67.5,0],[72.5,0],[77.5,0],[82.5,0],[87.5,0],[92.5,0],[97.5,0],[102.5,0],[107.5,82],[112.5,0],[117.5,65],[122.5,0],[127.5,88],[132.5,0],[137.5,0],[142.5,0],[147.5,0],[152.5,0],[157.5,0],[162.5,0],[167.5,0],[172.5,0],[177.5,0],[182.5,0],[187.5,0]],"t_end":192.5};
const INK="#0b0b0b", SEC="#52514e", MUT="#898781", GRID="#e1e0d9", SURF="#fcfcfb",
      BLUE="#2a78d6", ORANGE="#eb6834", RED="#d03b3b", GREEN="#008300", VIOLET="#4a3aa7";
document.getElementById("title").textContent = D.tag;
const cv = document.getElementById("cv"), tip = document.getElementById("tip");
const ctx = cv.getContext("2d");
const SIDS = (() => { const s = new Set(); (D.steps||[]).forEach(([,e]) => e.forEach(x => s.add(x[0])));
                      Object.keys(D.starve||{}).forEach(k => s.add(+k)); return [...s].sort((a,b)=>a-b); })();
const stepT = (D.steps||[]).map(s => s[0]);

// ---- layout ----
let W, H, dpr;
const OV = {h: 46};                      // overview strip
const tracks = [];                       // built in resize()
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = document.getElementById("wrap").clientWidth - 2;
  const laneH = SIDS.length ? Math.max(16, Math.min(30, 320/SIDS.length)) : 0;
  let y = OV.h + 26;
  tracks.length = 0;
  if (D.steps) { tracks.push({id:"lanes", y, h: laneH*SIDS.length}); y += laneH*SIDS.length + 24; }
  if (D.kv)    { tracks.push({id:"kv",    y, h: 88}); y += 112; }
  if (D.smi)   { tracks.push({id:"smi",   y, h: 62}); y += 86; }
  H = y + 8;
  cv.width = W*dpr; cv.height = H*dpr; cv.style.width = W+"px"; cv.style.height = H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
// ---- view state ----
let v0 = 0, v1 = Math.min(20, D.t_end);
const PX = t => (t - v0)/(v1 - v0)*W;
const bisect = (arr, t) => { let lo=0, hi=arr.length; while (lo<hi){const m=(lo+hi)>>1; arr[m]<t?lo=m+1:hi=m;} return lo; };

function draw() {
  ctx.clearRect(0,0,W,H);
  drawOverview();
  const secPx = W/(v1-v0);
  // time grid + tick marks
  const stepSec = niceStep((v1-v0)/8);
  ctx.textAlign="center"; ctx.font="11px system-ui"; ctx.fillStyle=MUT;
  for (let t=Math.ceil(v0/stepSec)*stepSec; t<=v1; t+=stepSec) {
    ctx.strokeStyle=GRID; ctx.beginPath(); ctx.moveTo(PX(t), OV.h+18); ctx.lineTo(PX(t), H-4); ctx.stroke();
    ctx.fillText(fmt(t)+"s", PX(t), OV.h+14);
  }
  if (D.ticks && secPx > 12) {           // gateway tick pushes (dotted)
    ctx.strokeStyle=MUT; ctx.setLineDash([1,3]);
    for (const t of D.ticks) if (t>=v0 && t<=v1) {
      ctx.beginPath(); ctx.moveTo(PX(t), OV.h+18); ctx.lineTo(PX(t), H-4); ctx.stroke(); }
    ctx.setLineDash([]);
  }
  for (const ev of (D.evictions||[])) if (ev>=v0 && ev<=v1) {
    ctx.strokeStyle=RED; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(PX(ev), OV.h+18); ctx.lineTo(PX(ev), H-4); ctx.stroke();
    ctx.setLineDash([]);
  }
  for (const tr of tracks) {
    if (tr.id==="lanes") drawLanes(tr);
    if (tr.id==="kv") drawKV(tr);
    if (tr.id==="smi") drawSMI(tr);
  }
}
function drawLanes(tr) {
  const laneH = tr.h/SIDS.length;
  ctx.textAlign="right"; ctx.font="11px system-ui";
  SIDS.forEach((sid,i) => {
    ctx.fillStyle=SEC; ctx.fillText("sid "+sid, 34, tr.y+i*laneH+laneH/2+4);
    ctx.strokeStyle=GRID; ctx.beginPath();
    ctx.moveTo(38, tr.y+i*laneH+laneH/2); ctx.lineTo(W, tr.y+i*laneH+laneH/2); ctx.stroke();
  });
  const i0 = Math.max(0, bisect(stepT, v0)-1), i1 = Math.min(D.steps.length, bisect(stepT, v1)+1);
  for (let i=i0; i<i1; i++) {
    const [t, ents] = D.steps[i];
    let t1 = i+1<D.steps.length ? stepT[i+1] : t+0.021;
    if (t1-t > 0.5) t1 = t+0.021;
    const x = PX(t), w = Math.max((t1-t)/(v1-v0)*W, 0.6);
    for (const [sid,n] of ents) {
      const li = SIDS.indexOf(sid);
      ctx.fillStyle = n>=40 ? ORANGE : BLUE;
      ctx.fillRect(x, tr.y+li*laneH+laneH*0.14, w-0.25, laneH*0.72);
    }
  }
}
function drawKV(tr) {
  label(tr, "KV pool / run / wait");
  const rows = D.kv, y0 = tr.y+tr.h, sc = tr.h;
  ctx.beginPath(); ctx.moveTo(PX(rows[0][0]), y0);
  for (const r of rows) ctx.lineTo(PX(r[0]), y0 - r[1]*sc);
  ctx.lineTo(PX(rows[rows.length-1][0]), y0); ctx.closePath();
  ctx.fillStyle = "rgba(11,11,11,0.08)"; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 1.4; poly(rows.map(r => [r[0], y0 - r[1]*sc])); ctx.lineWidth = 1;
  ctx.strokeStyle = "#1baf7a"; poly(rows.map(r => [r[0], y0 - (r[2]/8)*sc]));      // run (green-aqua)
  ctx.strokeStyle = VIOLET;    poly(rows.map(r => [r[0], y0 - (r[3]/8)*sc]));      // wait
  ctx.textAlign="left"; ctx.fillStyle=MUT; ctx.fillText("run/8", 42, tr.y+10);
}
function drawSMI(tr) {
  label(tr, "GPU SM util %");
  const y0 = tr.y+tr.h;
  ctx.strokeStyle = GREEN; poly(D.smi.map(r => [r[0], y0 - r[1]/100*tr.h]));
}
function drawOverview() {
  ctx.fillStyle="#f0efec"; ctx.fillRect(0,0,W,OV.h);
  if (D.kv) { ctx.strokeStyle=INK;
    poly(D.kv.map(r => [r[0], OV.h - r[1]*(OV.h-6) - 3]), t => t/D.t_end*W); }
  ctx.fillStyle=RED;
  for (const ev of (D.evictions||[])) ctx.fillRect(ev/D.t_end*W-1, 2, 2, OV.h-4);
  ctx.fillStyle="rgba(42,120,214,0.18)"; ctx.strokeStyle=BLUE;
  const x0=v0/D.t_end*W, x1=v1/D.t_end*W;
  ctx.fillRect(x0, 0, Math.max(x1-x0,2), OV.h); ctx.strokeRect(x0, 0, Math.max(x1-x0,2), OV.h);
}
// ---- helpers ----
function poly(pts, xf) { ctx.beginPath();
  pts.forEach((p,i) => { const x = xf ? xf(p[0]) : PX(p[0]); i?ctx.lineTo(x,p[1]):ctx.moveTo(x,p[1]); });
  ctx.stroke(); }
function label(tr, s) { ctx.textAlign="left"; ctx.font="11px system-ui"; ctx.fillStyle=SEC;
  ctx.fillText(s, 4, tr.y - 6); ctx.strokeStyle=GRID;
  [0,1].forEach(f => { ctx.beginPath(); ctx.moveTo(38, tr.y+tr.h*f); ctx.lineTo(W, tr.y+tr.h*f); ctx.stroke(); }); }
function niceStep(r){ const p=Math.pow(10,Math.floor(Math.log10(r))); const m=r/p;
  return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p; }
function fmt(t){ return t>=100?t.toFixed(0):t>=10?t.toFixed(1):t.toFixed(2); }
// ---- interactions ----
cv.addEventListener("wheel", e => { e.preventDefault();
  const mt = v0 + (e.offsetX/W)*(v1-v0), f = Math.exp(e.deltaY*0.0015);
  v0 = mt - (mt-v0)*f; v1 = mt + (v1-mt)*f;
  v0 = Math.max(-2, v0); v1 = Math.min(D.t_end, v1); draw(); }, {passive:false});
let drag = null;
cv.addEventListener("mousedown", e => {
  if (e.offsetY < OV.h) { const c = e.offsetX/W*D.t_end, half=(v1-v0)/2;
    v0 = Math.max(-2, c-half); v1 = Math.min(D.t_end, c+half); draw(); return; }
  drag = {x: e.offsetX, v0, v1}; });
window.addEventListener("mouseup", () => drag = null);
cv.addEventListener("dblclick", () => { v0 = 0; v1 = Math.min(20, D.t_end); draw(); });
cv.addEventListener("mousemove", e => {
  if (drag) { const dt = (drag.x-e.offsetX)/W*(drag.v1-drag.v0);
    v0 = drag.v0+dt; v1 = drag.v1+dt; draw(); return; }
  // tooltip: lanes cells + kv rows
  const t = v0 + e.offsetX/W*(v1-v0);
  let txt = null;
  const lanes = tracks.find(tr => tr.id==="lanes");
  if (lanes && e.offsetY >= lanes.y && e.offsetY < lanes.y+lanes.h && D.steps) {
    const i = Math.max(0, bisect(stepT, t)-1);
    if (i < D.steps.length) {
      const [st, ents] = D.steps[i];
      const dt = i+1<D.steps.length ? stepT[i+1]-st : 0.021;
      if (t >= st && t <= st+Math.min(dt,0.5)) {
        const laneH = lanes.h/SIDS.length, sid = SIDS[Math.floor((e.offsetY-lanes.y)/laneH)];
        const ent = ents.find(x => x[0]===sid);
        if (ent) txt = `t=${st.toFixed(3)}s  sid ${sid}\n`+
          (ent[1]>=40?`chunk prefill ${ent[1]} tok${ent[2]?" +encoder":""}`:`decode (${ent[1]} tok)`)+
          `\nstep ${(Math.min(dt,0.5)*1000).toFixed(1)} ms · batch ${ents.length}`;
      }
    }
  }
  const kvtr = tracks.find(tr => tr.id==="kv");
  if (!txt && kvtr && D.kv && e.offsetY >= kvtr.y && e.offsetY < kvtr.y+kvtr.h) {
    const kt = D.kv.map(r=>r[0]), i = Math.min(D.kv.length-1, Math.max(0, bisect(kt, t)));
    const r = D.kv[i];
    txt = `t=${r[0].toFixed(1)}s\nKV pool ${(r[1]*100).toFixed(1)}%\nrun ${r[2]} · wait ${r[3]} · evictions ${r[4]}`;
  }
  if (txt) { tip.style.display="block"; tip.textContent = txt;
    tip.style.left = Math.min(e.offsetX+14, W-180)+"px"; tip.style.top = (e.offsetY+16)+"px"; }
  else tip.style.display="none";
});
window.addEventListener("resize", resize);
resize();
</script>
