<svg xmlns="http://www.w3.org/2000/svg" width="2056" height="1460" viewBox="0 0 2056 1460">
  <defs>
    <style>
      .sans  { font-family: "Hiragino Sans GB", "PingFang SC", sans-serif; }
      .mono  { font-family: "Menlo", "Hiragino Sans GB", "PingFang SC", monospace; }
      .dark  { fill: #3F3B33; }
      .gray  { fill: #8E8677; }
      .orange{ fill: #D9641E; }
      .mustard{ fill: #B8901E; }
      .blue  { fill: #4477AE; }
    </style>
  </defs>

  <!-- background + card -->
  <rect x="0" y="0" width="2056" height="1460" fill="#F6F2E8"/>
  <rect x="18" y="18" width="2020" height="1424" rx="26" fill="#FDFBF5" stroke="#E8E1D2" stroke-width="2"/>

  <!-- ============ Panel A ============ -->
  <text x="105" y="100" class="mono dark" font-size="34" font-weight="700">A · 聊天 / 智能体请求</text>
  <text x="105" y="145" class="mono gray" font-size="27">回合制——回合之间存在空闲</text>

  <!-- legend -->
  <rect x="1498" y="76" width="30" height="30" rx="7" fill="#D9D1BD" stroke="#B0A68C" stroke-width="2"/>
  <text x="1542" y="100" class="mono gray" font-size="26">prefill</text>
  <rect x="1712" y="76" width="30" height="30" rx="7" fill="#F7D9C8" stroke="#ECC3AB" stroke-width="2"/>
  <text x="1756" y="100" class="mono gray" font-size="26">decode</text>

  <!-- turn labels -->
  <text x="283" y="212" class="mono dark" font-size="27" text-anchor="middle">回合 1</text>
  <text x="862" y="212" class="mono dark" font-size="27" text-anchor="middle">回合 2</text>
  <text x="1503" y="212" class="mono dark" font-size="27" text-anchor="middle">回合 3</text>

  <!-- turn 1 blocks -->
  <rect x="188" y="230" width="58" height="62" rx="10" fill="#D9D1BD" stroke="#B0A68C" stroke-width="2"/>
  <rect x="248" y="230" width="130" height="62" rx="10" fill="#F7D9C8" stroke="#ECC3AB" stroke-width="2"/>
  <!-- idle 1 -->
  <text x="558" y="270" class="mono gray" font-size="27" font-style="italic" text-anchor="middle">空闲：用户思考中…</text>
  <!-- turn 2 blocks -->
  <rect x="742" y="230" width="88" height="62" rx="10" fill="#D9D1BD" stroke="#B0A68C" stroke-width="2"/>
  <rect x="832" y="230" width="150" height="62" rx="10" fill="#F7D9C8" stroke="#ECC3AB" stroke-width="2"/>
  <!-- idle 2 -->
  <text x="1173" y="270" class="mono gray" font-size="27" font-style="italic" text-anchor="middle">空闲：工具调用执行中…</text>
  <!-- turn 3 blocks -->
  <rect x="1365" y="230" width="118" height="62" rx="10" fill="#D9D1BD" stroke="#B0A68C" stroke-width="2"/>
  <rect x="1485" y="230" width="156" height="62" rx="10" fill="#F7D9C8" stroke="#ECC3AB" stroke-width="2"/>

  <!-- time axis A -->
  <line x1="160" y1="312" x2="1876" y2="312" stroke="#A39A88" stroke-width="2"/>
  <text x="1892" y="321" class="mono gray" font-size="27">时间</text>

  <!-- KV label A -->
  <text x="105" y="392" class="mono gray" font-size="27">GPU 显存 (HBM)</text>
  <text x="105" y="426" class="mono gray" font-size="27">中的 KV</text>

  <!-- KV line A -->
  <polyline points="188,430 222,398 367,398 367,430 732,430 812,375 973,368 973,430
                    1367,430 1455,352 1635,340 1635,430 1876,430"
            fill="none" stroke="#56524B" stroke-width="3.5"
            stroke-linejoin="round" stroke-linecap="round"/>

  <!-- swap arrows pair 1 -->
  <line x1="487" y1="390" x2="487" y2="526" stroke="#B8901E" stroke-width="3"/>
  <polygon points="487,544 478,522 496,522" fill="#B8901E"/>
  <line x1="602" y1="544" x2="602" y2="408" stroke="#B8901E" stroke-width="3"/>
  <polygon points="602,390 593,412 611,412" fill="#B8901E"/>
  <text x="468" y="478" class="mono mustard" font-size="27" text-anchor="end">换出</text>
  <text x="622" y="478" class="mono mustard" font-size="27">换入</text>

  <!-- swap arrows pair 2 -->
  <line x1="1095" y1="390" x2="1095" y2="526" stroke="#B8901E" stroke-width="3"/>
  <polygon points="1095,544 1086,522 1104,522" fill="#B8901E"/>
  <line x1="1212" y1="544" x2="1212" y2="408" stroke="#B8901E" stroke-width="3"/>
  <polygon points="1212,390 1203,412 1221,412" fill="#B8901E"/>
  <text x="1076" y="478" class="mono mustard" font-size="27" text-anchor="end">换出</text>
  <text x="1232" y="478" class="mono mustard" font-size="27">换入</text>

  <!-- reactivation note -->
  <text x="1876" y="478" class="mono dark" font-size="28" font-style="italic" text-anchor="end">每次重新激活的代价越来越高</text>

  <!-- DRAM dashed lane -->
  <line x1="160" y1="560" x2="1876" y2="560" stroke="#B5AC99" stroke-width="2" stroke-dasharray="9 9"/>
  <text x="160" y="600" class="mono gray" font-size="27">主机内存 (DRAM)——状态暂存于此，开销藏进空闲间隙</text>

  <!-- ============ Panel B ============ -->
  <text x="105" y="712" class="mono dark" font-size="34" font-weight="700">B · 双工交互会话</text>
  <text x="105" y="755" class="mono blue" font-size="27">周期性 + 持续在线——全程没有空闲</text>

  <!-- period arc + deadline label -->
  <path d="M 330 802 Q 418 762 506 802" fill="none" stroke="#D9641E" stroke-width="2.5"/>
  <text x="540" y="790" class="mono orange" font-size="28">周期性 deadline——每 80 ms 至 2 s 一个</text>

  <!-- small block pairs -->
  <g>
    <g transform="translate(188,0)">
      <rect x="0" y="812" width="34" height="42" rx="7" fill="#D9D1BD" stroke="#B0A68C" stroke-width="2"/>
      <rect x="40" y="812" width="28" height="42" rx="7" fill="#F7D9C8" stroke="#ECC3AB" stroke-width="2"/>
    </g>
    <g transform="translate(370,0)">
      <rect x="0" y="812" width="34" height="42" rx="7" fill="#D9D1BD" stroke="#B0A68C" stroke-width="2"/>
      <rect x="40" y="812" width="28" height="42" rx="7" fill="#F7D9C8" stroke="#ECC3AB" stroke-width="2"/>
    </g>
    <g transform="translate(552,0)">
      <rect x="0" y="812" width="34" height="42" rx="7" fill="#D9D1BD" stroke="#B0A68C" stroke-width="2"/>
      <rect x="40" y="812" width="28" height="42" rx="7" fill="#F7D9C8" stroke="#ECC3AB" stroke-width="2"/>
    </g>
    <g transform="translate(734,0)">
      <rect x="0" y="812" width="34" height="42" rx="7" fill="#D9D1BD" stroke="#B0A68C" stroke-width="2"/>
      <rect x="40" y="812" width="28" height="42" rx="7" fill="#F7D9C8" stroke="#ECC3AB" stroke-width="2"/>
    </g>
    <g transform="translate(916,0)">
      <rect x="0" y="812" width="34" height="42" rx="7" fill="#D9D1BD" stroke="#B0A68C" stroke-width="2"/>
      <rect x="40" y="812" width="28" height="42" rx="7" fill="#F7D9C8" stroke="#ECC3AB" stroke-width="2"/>
    </g>
    <g transform="translate(1098,0)">
      <rect x="0" y="812" width="34" height="42" rx="7" fill="#D9D1BD" stroke="#B0A68C" stroke-width="2"/>
      <rect x="40" y="812" width="28" height="42" rx="7" fill="#F7D9C8" stroke="#ECC3AB" stroke-width="2"/>
    </g>
    <g transform="translate(1280,0)">
      <rect x="0" y="812" width="34" height="42" rx="7" fill="#D9D1BD" stroke="#B0A68C" stroke-width="2"/>
      <rect x="40" y="812" width="28" height="42" rx="7" fill="#F7D9C8" stroke="#ECC3AB" stroke-width="2"/>
    </g>
    <g transform="translate(1462,0)">
      <rect x="0" y="812" width="34" height="42" rx="7" fill="#D9D1BD" stroke="#B0A68C" stroke-width="2"/>
      <rect x="40" y="812" width="28" height="42" rx="7" fill="#F7D9C8" stroke="#ECC3AB" stroke-width="2"/>
    </g>
    <g transform="translate(1644,0)">
      <rect x="0" y="812" width="34" height="42" rx="7" fill="#D9D1BD" stroke="#B0A68C" stroke-width="2"/>
      <rect x="40" y="812" width="28" height="42" rx="7" fill="#F7D9C8" stroke="#ECC3AB" stroke-width="2"/>
    </g>
  </g>

  <!-- deadline ticks -->
  <g stroke="#D9641E" stroke-width="3">
    <line x1="305"  y1="820" x2="305"  y2="896"/>
    <line x1="487"  y1="820" x2="487"  y2="896"/>
    <line x1="669"  y1="820" x2="669"  y2="896"/>
    <line x1="851"  y1="820" x2="851"  y2="896"/>
    <line x1="1033" y1="820" x2="1033" y2="896"/>
    <line x1="1215" y1="820" x2="1215" y2="896"/>
    <line x1="1397" y1="820" x2="1397" y2="896"/>
    <line x1="1579" y1="820" x2="1579" y2="896"/>
    <line x1="1761" y1="820" x2="1761" y2="896"/>
  </g>

  <!-- time axis B -->
  <line x1="160" y1="862" x2="1876" y2="862" stroke="#A39A88" stroke-width="2"/>
  <text x="1892" y="871" class="mono gray" font-size="27">时间</text>

  <text x="188" y="940" class="mono dark" font-size="27" font-style="italic">每帧：音频输入 → token 输出</text>

  <!-- KV label B -->
  <text x="105" y="1000" class="mono gray" font-size="27">GPU 显存 (HBM)</text>
  <text x="105" y="1034" class="mono gray" font-size="27">中的 KV</text>

  <!-- KV staircase B -->
  <polyline points="188,1075 320,1075 350,1062 505,1062 535,1050 680,1050 700,1040 860,1040
                    880,1029 1030,1029 1055,1018 1215,1018 1235,1008 1390,1008 1415,997
                    1560,997 1580,987 1740,987 1760,978 1830,975"
            fill="none" stroke="#D9641E" stroke-width="4"
            stroke-linejoin="round" stroke-linecap="round"/>

  <text x="1876" y="1132" class="mono orange" font-size="29" font-style="italic" text-anchor="end">常驻 KV 逐帧增长——没有空闲可供换出</text>

  <!-- divider -->
  <line x1="80" y1="1210" x2="1976" y2="1210" stroke="#E0D9C8" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- caption -->
  <text x="105" y="1272" class="sans dark" font-size="30">聊天 / 智能体请求 (A) 可在回合间把增长的 KV 移出显存，付出<tspan font-weight="700">重新激活的代价</tspan>——空闲间隙掩盖了这笔开销，尚可承受。</text>
  <text x="105" y="1320" class="sans dark" font-size="30">双工交互会话 (B) 每帧都有 deadline、全程没有空闲，KV 必须<tspan font-weight="700">常驻</tspan>显存，并随会话时长无界增长。</text>
  <text x="105" y="1368" class="sans dark" font-size="30">「<tspan font-weight="700">周期性 deadline + 无界常驻状态</tspan>」正是本项目面对的负载形态。</text>
</svg>
