<svg xmlns="http://www.w3.org/2000/svg" width="2056" height="1300" viewBox="0 0 2056 1300">
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6B6355"/></marker>
    <marker id="ah-mustard" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#B8901E"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#9A9182"/></marker>
  </defs>
  <style>
    .cjk { font-family: "Hiragino Sans GB", "PingFang SC", sans-serif; fill: #4A4438; }
    .mono { font-family: "Menlo", "Hiragino Sans GB", monospace; fill: #4A4438; }
    .gray { fill: #8A8272; }
    .b { font-weight: 700; }
    .white { fill: #FFFFFF; }
    .green { fill: #2F9E63; }
    .amber { fill: #C0841F; }
    .orange { fill: #D9641E; }
  </style>

  <!-- 卡片底 -->
  <rect x="20" y="20" width="2016" height="1260" rx="24" fill="#FDFBF5" stroke="#E5DCC8" stroke-width="2"/>

  <!-- ================= 上半：空间结构 ================= -->

  <!-- 左：用户 -->
  <circle cx="235" cy="190" r="40" fill="none" stroke="#6B6355" stroke-width="4"/>
  <path d="M160,320 Q235,240 310,320" fill="none" stroke="#6B6355" stroke-width="4" stroke-linecap="round"/>
  <path d="M300,165 q22,25 0,50" fill="none" stroke="#B8901E" stroke-width="4" stroke-linecap="round"/>
  <path d="M330,150 q34,40 0,80" fill="none" stroke="#B8901E" stroke-width="3.2" stroke-linecap="round" opacity="0.75"/>
  <path d="M360,135 q46,55 0,110" fill="none" stroke="#B8901E" stroke-width="2.6" stroke-linecap="round" opacity="0.5"/>
  <text x="235" y="382" class="cjk b" font-size="34" text-anchor="middle">用户 / 真实世界</text>
  <text x="235" y="428" class="cjk gray" font-size="25" text-anchor="middle">连续语音 · 随时打断</text>
  <text x="235" y="466" class="cjk gray" font-size="23" text-anchor="middle" font-style="italic">实时收听模型输出</text>

  <!-- 用户 ⇄ 运行时 箭头 + 网络分界 -->
  <g stroke="#B8AE9A" stroke-width="2" stroke-dasharray="6,8" stroke-linecap="round">
    <line x1="480" y1="216" x2="480" y2="235"/>
    <line x1="480" y1="300" x2="480" y2="405"/>
    <line x1="480" y1="492" x2="480" y2="520"/>
  </g>
  <text x="480" y="205" class="mono gray" font-size="22" text-anchor="middle">网络</text>
  <line x1="405" y1="280" x2="548" y2="280" stroke="#6B6355" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-ink)"/>
  <text x="476" y="262" class="mono" font-size="22" text-anchor="middle">语音流（上行）</text>
  <line x1="548" y1="430" x2="405" y2="430" stroke="#6B6355" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-ink)"/>
  <text x="476" y="472" class="mono" font-size="22" text-anchor="middle">语音播放（下行）</text>

  <!-- 中：本项目面板 -->
  <rect x="560" y="110" width="750" height="530" rx="18" fill="#FFFEF8" stroke="#2E6FC2" stroke-width="3.5"/>
  <rect x="700" y="84" width="470" height="52" rx="26" fill="#2E6FC2"/>
  <text x="935" y="119" class="cjk b white" font-size="27" text-anchor="middle">本项目 · Omni 交互运行时</text>

  <!-- 前台双工模型 -->
  <rect x="620" y="176" width="630" height="150" rx="12" fill="#F7F2E4" stroke="#A89878" stroke-width="2"/>
  <polyline points="650,251 668,231 686,266 704,226 722,271 740,241 758,256 776,246"
            fill="none" stroke="#D9641E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1015" y="245" class="cjk b" font-size="32" text-anchor="middle">前台双工模型</text>
  <text x="1015" y="293" class="cjk gray" font-size="24" text-anchor="middle">周期性推理 · 边听边说</text>

  <!-- 会话状态 (KV) 内存条 -->
  <text x="620" y="404" class="cjk b" font-size="28">会话状态 (KV)</text>
  <rect x="620" y="428" width="630" height="64" rx="10" fill="#F1EBDC" stroke="#A89878" stroke-width="2"/>
  <path d="M630,432 h480 a20,28 0 0 1 20,28 v0 a20,28 0 0 1 -20,28 h-480 a6,6 0 0 1 -6,-6 v-44 a6,6 0 0 1 6,-6 Z" fill="#D8CEB8"/>
  <line x1="700" y1="430" x2="700" y2="490" stroke="#FDFBF5" stroke-width="2"/>
  <line x1="780" y1="430" x2="780" y2="490" stroke="#FDFBF5" stroke-width="2"/>
  <line x1="860" y1="430" x2="860" y2="490" stroke="#FDFBF5" stroke-width="2"/>
  <line x1="940" y1="430" x2="940" y2="490" stroke="#FDFBF5" stroke-width="2"/>
  <line x1="1020" y1="430" x2="1020" y2="490" stroke="#FDFBF5" stroke-width="2"/>
  <line x1="1100" y1="430" x2="1100" y2="490" stroke="#FDFBF5" stroke-width="2"/>
  <line x1="1140" y1="460" x2="1225" y2="460" stroke="#B8901E" stroke-width="3" marker-end="url(#ah-mustard)"/>
  <text x="1250" y="404" class="cjk gray" font-size="23" text-anchor="end" font-style="italic">GPU 显存 · 随会话时长持续增长</text>

  <!-- 标注 ① -->
  <line x1="660" y1="496" x2="660" y2="560" stroke="#2F9E63" stroke-width="2" stroke-dasharray="4,6"/>
  <circle cx="660" cy="584" r="22" fill="#2F9E63"/>
  <text x="660" y="593" class="cjk b white" font-size="24" text-anchor="middle">1</text>
  <text x="696" y="593" class="mono green" font-size="24">状态只增不减，显存必先于算力耗尽 → 研究点 1</text>

  <!-- 运行时 ⇄ JiuwenSwarm 箭头 -->
  <line x1="1322" y1="280" x2="1518" y2="280" stroke="#6B6355" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-ink)"/>
  <text x="1420" y="262" class="mono" font-size="22" text-anchor="middle">任务派发（异步）</text>
  <line x1="1518" y1="430" x2="1322" y2="430" stroke="#6B6355" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-ink)"/>
  <text x="1420" y="472" class="mono" font-size="22" text-anchor="middle">结果写回</text>

  <!-- 右：JiuwenSwarm -->
  <rect x="1530" y="110" width="470" height="530" rx="18" fill="#F7F4EC" stroke="#A89878" stroke-width="2"/>
  <text x="1765" y="180" class="cjk b" font-size="34" text-anchor="middle">JiuwenSwarm</text>
  <text x="1765" y="222" class="cjk gray" font-size="24" text-anchor="middle">多智能体协作系统</text>
  <line x1="1765" y1="330" x2="1642" y2="447" stroke="#B8AE9A" stroke-width="2"/>
  <line x1="1765" y1="330" x2="1732" y2="472" stroke="#B8AE9A" stroke-width="2"/>
  <line x1="1765" y1="330" x2="1832" y2="462" stroke="#B8AE9A" stroke-width="2"/>
  <line x1="1765" y1="330" x2="1908" y2="412" stroke="#B8AE9A" stroke-width="2"/>
  <circle cx="1765" cy="330" r="38" fill="#D8CEB8" stroke="#A89878" stroke-width="2.5"/>
  <text x="1765" y="337" class="mono" font-size="19" text-anchor="middle">Leader</text>
  <circle cx="1642" cy="447" r="24" fill="#F2CBB8" stroke="#D9A183" stroke-width="2"/>
  <circle cx="1732" cy="472" r="24" fill="#F2CBB8" stroke="#D9A183" stroke-width="2"/>
  <circle cx="1832" cy="462" r="24" fill="#F2CBB8" stroke="#D9A183" stroke-width="2"/>
  <circle cx="1908" cy="412" r="24" fill="#F2CBB8" stroke="#D9A183" stroke-width="2"/>
  <rect x="1552" y="545" width="150" height="46" rx="23" fill="#EFE9DA"/>
  <text x="1627" y="576" class="cjk" font-size="22" text-anchor="middle">技能自进化</text>
  <rect x="1712" y="545" width="130" height="46" rx="23" fill="#EFE9DA"/>
  <text x="1777" y="576" class="cjk" font-size="22" text-anchor="middle">工具调用</text>
  <rect x="1852" y="545" width="130" height="46" rx="23" fill="#EFE9DA"/>
  <text x="1917" y="576" class="cjk" font-size="22" text-anchor="middle">群体协作</text>

  <!-- 标注 ③：横跨全链路 -->
  <path d="M235,686 V700 H1765 V686" fill="none" stroke="#D9641E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="1000" y1="700" x2="1000" y2="711" stroke="#D9641E" stroke-width="2" stroke-dasharray="4,6"/>
  <circle cx="1000" cy="735" r="22" fill="#D9641E"/>
  <text x="1000" y="744" class="cjk b white" font-size="24" text-anchor="middle">3</text>
  <text x="1036" y="744" class="mono orange" font-size="24">四环节各自留余量，写回时机无人统筹 → 研究点 3</text>

  <!-- ================= 下半：时间结构 ================= -->

  <text x="90" y="840" class="cjk b" font-size="26" fill="#D9641E">前台 · 刚性周期</text>
  <line x1="330" y1="880" x2="1985" y2="880" stroke="#8A8272" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-gray)"/>
  <text x="1985" y="850" class="cjk gray" font-size="22" text-anchor="end">时间</text>

  <!-- deadline 刻度（9 根，界出 8 格） -->
  <g stroke="#D9641E" stroke-width="3">
    <line x1="330" y1="830" x2="330" y2="880"/><line x1="530" y1="830" x2="530" y2="880"/>
    <line x1="730" y1="830" x2="730" y2="880"/><line x1="930" y1="830" x2="930" y2="880"/>
    <line x1="1130" y1="830" x2="1130" y2="880"/><line x1="1330" y1="830" x2="1330" y2="880"/>
    <line x1="1530" y1="830" x2="1530" y2="880"/><line x1="1730" y1="830" x2="1730" y2="880"/>
    <line x1="1930" y1="830" x2="1930" y2="880"/>
  </g>

  <!-- 每格的计算块（tan + salmon 对） -->
  <g>
    <rect x="345" y="807" width="34" height="52" rx="8" fill="#D8CEB8" stroke="#A89878" stroke-width="1.6"/><rect x="384" y="807" width="26" height="52" rx="8" fill="#F2CBB8" stroke="#D9A183" stroke-width="1.6"/>
    <rect x="545" y="807" width="34" height="52" rx="8" fill="#D8CEB8" stroke="#A89878" stroke-width="1.6"/><rect x="584" y="807" width="26" height="52" rx="8" fill="#F2CBB8" stroke="#D9A183" stroke-width="1.6"/>
    <rect x="745" y="807" width="34" height="52" rx="8" fill="#D8CEB8" stroke="#A89878" stroke-width="1.6"/><rect x="784" y="807" width="26" height="52" rx="8" fill="#F2CBB8" stroke="#D9A183" stroke-width="1.6"/>
    <rect x="945" y="807" width="34" height="52" rx="8" fill="#D8CEB8" stroke="#A89878" stroke-width="1.6"/><rect x="984" y="807" width="26" height="52" rx="8" fill="#F2CBB8" stroke="#D9A183" stroke-width="1.6"/>
    <rect x="1145" y="807" width="34" height="52" rx="8" fill="#D8CEB8" stroke="#A89878" stroke-width="1.6"/><rect x="1184" y="807" width="26" height="52" rx="8" fill="#F2CBB8" stroke="#D9A183" stroke-width="1.6"/>
    <rect x="1345" y="807" width="34" height="52" rx="8" fill="#D8CEB8" stroke="#A89878" stroke-width="1.6"/><rect x="1384" y="807" width="26" height="52" rx="8" fill="#F2CBB8" stroke="#D9A183" stroke-width="1.6"/>
    <rect x="1545" y="807" width="34" height="52" rx="8" fill="#D8CEB8" stroke="#A89878" stroke-width="1.6"/><rect x="1584" y="807" width="26" height="52" rx="8" fill="#F2CBB8" stroke="#D9A183" stroke-width="1.6"/>
    <rect x="1745" y="807" width="34" height="52" rx="8" fill="#D8CEB8" stroke="#A89878" stroke-width="1.6"/><rect x="1784" y="807" width="26" height="52" rx="8" fill="#F2CBB8" stroke="#D9A183" stroke-width="1.6"/>
  </g>

  <!-- 标注 ②：单格放大括号 -->
  <path d="M545,900 V910 H735 V900" fill="none" stroke="#C0841F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="640" y1="910" x2="640" y2="918" stroke="#C0841F" stroke-width="2" stroke-dasharray="4,6"/>
  <circle cx="640" cy="942" r="22" fill="#C0841F"/>
  <text x="640" y="951" class="cjk b white" font-size="24" text-anchor="middle">2</text>
  <text x="676" y="951" class="mono amber" font-size="24">开销压过计算：通用引擎不识别固定形状 → 研究点 2</text>

  <!-- 后台弹性任务 -->
  <text x="90" y="1066" class="cjk b" font-size="26" fill="#8A8272">后台 · 弹性任务</text>
  <rect x="900" y="1025" width="560" height="62" rx="31" fill="#E9E3D4" stroke="#B8AE9A" stroke-width="2"/>
  <text x="1180" y="1066" class="cjk gray" font-size="25" text-anchor="middle">后台任务（异步 · 弹性）</text>
  <path d="M1465,1053 Q1640,1034 1655,891" fill="none" stroke="#B8901E" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-mustard)"/>
  <text x="1692" y="1000" class="cjk" font-size="25" fill="#B8901E">结果注入</text>

  <!-- 底部注释 -->
  <line x1="90" y1="1145" x2="1966" y2="1145" stroke="#E5DCC8" stroke-width="2" stroke-dasharray="6,8"/>
  <text x="1028" y="1220" font-size="27" text-anchor="middle" class="cjk">前台持续听说，后台群体协作；三个研究点解决同一条交互链路上的<tspan class="b">状态、执行与协同</tspan>问题。</text>
</svg>
