<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="620" viewBox="0 0 2000 620">
  <style>
    .cjk { font-family: "Hiragino Sans GB", "PingFang SC", sans-serif; fill: #4A4438; }
    .mono { font-family: "Menlo", "Hiragino Sans GB", "PingFang SC", monospace; fill: #4A4438; }
    .gray { fill: #8A8272; }
    .b { font-weight: 700; }
  </style>

  <rect width="2000" height="620" fill="#FDFBF5"/>

  <!-- ===== 行 1：现状（实测形状） ===== -->
  <text x="30" y="88" class="cjk b" font-size="30">现状（实测）</text>
  <text x="30" y="128" class="cjk gray" font-size="22">周期几乎被执行占满</text>

  <!-- 周期条底 -->
  <rect x="360" y="52" width="1560" height="88" rx="10" fill="#F7F4EC" stroke="#C9C0A8" stroke-width="2"/>
  <!-- 步链：8 组（1 个无图化关键步 + 若干已图化小步） -->
  <g>
    <rect x="372" y="64" width="92" height="64" rx="8" fill="#F2CBB8" stroke="#D9641E" stroke-width="2.5"/>
    <rect x="470" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="497" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="524" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/>
    <rect x="558" y="64" width="92" height="64" rx="8" fill="#F2CBB8" stroke="#D9641E" stroke-width="2.5"/>
    <rect x="656" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="683" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="710" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/>
    <rect x="744" y="64" width="92" height="64" rx="8" fill="#F2CBB8" stroke="#D9641E" stroke-width="2.5"/>
    <rect x="842" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="869" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="896" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/>
    <rect x="930" y="64" width="92" height="64" rx="8" fill="#F2CBB8" stroke="#D9641E" stroke-width="2.5"/>
    <rect x="1028" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="1055" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="1082" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/>
    <rect x="1116" y="64" width="92" height="64" rx="8" fill="#F2CBB8" stroke="#D9641E" stroke-width="2.5"/>
    <rect x="1214" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="1241" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="1268" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/>
    <rect x="1302" y="64" width="92" height="64" rx="8" fill="#F2CBB8" stroke="#D9641E" stroke-width="2.5"/>
    <rect x="1400" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="1427" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="1454" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/>
    <rect x="1488" y="64" width="92" height="64" rx="8" fill="#F2CBB8" stroke="#D9641E" stroke-width="2.5"/>
    <rect x="1586" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="1613" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="1640" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/>
    <rect x="1674" y="64" width="92" height="64" rx="8" fill="#F2CBB8" stroke="#D9641E" stroke-width="2.5"/>
    <rect x="1772" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="1799" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="1826" y="72" width="22" height="48" rx="5" fill="#D8CEB8"/>
  </g>
  <!-- 周期边界 -->
  <line x1="360" y1="40" x2="360" y2="152" stroke="#D9641E" stroke-width="3.5"/>
  <line x1="1920" y1="40" x2="1920" y2="152" stroke="#D9641E" stroke-width="3.5"/>
  <text x="360" y="30" class="mono" font-size="22" fill="#D9641E">周期开始</text>
  <text x="1920" y="30" class="mono" font-size="22" fill="#D9641E" text-anchor="end">deadline</text>
  <!-- 空隙标注 -->
  <text x="1875" y="103" class="mono gray" font-size="20" text-anchor="middle">空隙≈0</text>

  <!-- 图例行 -->
  <g>
    <rect x="360" y="188" width="40" height="30" rx="6" fill="#F2CBB8" stroke="#D9641E" stroke-width="2.5"/>
    <text x="414" y="211" class="cjk" font-size="23">未被图化的关键步（每周期 8 次，约 3 倍于已图化步）</text>
    <rect x="1150" y="188" width="24" height="30" rx="5" fill="#D8CEB8"/>
    <text x="1188" y="211" class="cjk" font-size="23">已图化的常规步</text>
  </g>

  <!-- ===== 行 2：特化后（推导） ===== -->
  <text x="30" y="330" class="cjk b" font-size="30">特化后（推导）</text>
  <text x="30" y="370" class="cjk gray" font-size="22">关键步纳入整步重放</text>

  <rect x="360" y="294" width="1560" height="88" rx="10" fill="#F7F4EC" stroke="#C9C0A8" stroke-width="2"/>
  <g>
    <rect x="372" y="306" width="40" height="64" rx="8" fill="#F2CBB8" stroke="#D9A183" stroke-width="2"/>
    <rect x="418" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="445" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="472" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/>
    <rect x="506" y="306" width="40" height="64" rx="8" fill="#F2CBB8" stroke="#D9A183" stroke-width="2"/>
    <rect x="552" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="579" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="606" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/>
    <rect x="640" y="306" width="40" height="64" rx="8" fill="#F2CBB8" stroke="#D9A183" stroke-width="2"/>
    <rect x="686" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="713" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="740" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/>
    <rect x="774" y="306" width="40" height="64" rx="8" fill="#F2CBB8" stroke="#D9A183" stroke-width="2"/>
    <rect x="820" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="847" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="874" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/>
    <rect x="908" y="306" width="40" height="64" rx="8" fill="#F2CBB8" stroke="#D9A183" stroke-width="2"/>
    <rect x="954" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="981" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="1008" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/>
    <rect x="1042" y="306" width="40" height="64" rx="8" fill="#F2CBB8" stroke="#D9A183" stroke-width="2"/>
    <rect x="1088" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="1115" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="1142" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/>
    <rect x="1176" y="306" width="40" height="64" rx="8" fill="#F2CBB8" stroke="#D9A183" stroke-width="2"/>
    <rect x="1222" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="1249" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="1276" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/>
    <rect x="1310" y="306" width="40" height="64" rx="8" fill="#F2CBB8" stroke="#D9A183" stroke-width="2"/>
    <rect x="1356" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="1383" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/><rect x="1410" y="314" width="22" height="48" rx="5" fill="#D8CEB8"/>
  </g>
  <!-- 腾出的写回预算 -->
  <rect x="1452" y="306" width="456" height="64" rx="8" fill="#2F9E63" fill-opacity="0.14" stroke="#2F9E63" stroke-width="2.5" stroke-dasharray="8,6"/>
  <text x="1680" y="346" class="cjk b" font-size="25" text-anchor="middle" fill="#2F9E63">腾出的时间预算 → 后台结果写回</text>
  <line x1="360" y1="282" x2="360" y2="394" stroke="#D9641E" stroke-width="3.5"/>
  <line x1="1920" y1="282" x2="1920" y2="394" stroke="#D9641E" stroke-width="3.5"/>

  <!-- 底部一句话 -->
  <line x1="30" y1="470" x2="1970" y2="470" stroke="#E5DCC8" stroke-width="2" stroke-dasharray="7,9"/>
  <text x="1000" y="545" class="cjk" font-size="28" text-anchor="middle">收益来源：关键步落在引擎图化机制的覆盖之外——输入形状固定，本可<tspan class="b">规划一次、周期重放</tspan></text>
</svg>
