<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1230" viewBox="0 0 940 1230">
  <defs>
    <marker id="rp3-ink" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8.5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6B6355"/>
    </marker>
  </defs>
  <style>
    .cjk { font-family: "Hiragino Sans GB", "PingFang SC", sans-serif; fill: #4A4438; }
    .mono { font-family: "Menlo", "Hiragino Sans GB", "PingFang SC", monospace; fill: #4A4438; }
    .b { font-weight: 700; }
    .white { fill: #FFFFFF; }
    .salmon { fill: #F2CBB8; }
  </style>

  <rect width="940" height="1230" fill="#F6F2E8"/>
  <rect x="18" y="18" width="904" height="1194" rx="26" fill="#FDFBF5" stroke="#E5DCC8" stroke-width="2"/>

  <!-- Four interaction stages -->
  <g fill="#F7F2E4" stroke="#A89878" stroke-width="2.5">
    <rect x="72" y="82" width="398" height="120" rx="18"/>
    <rect x="72" y="270" width="398" height="120" rx="18" fill="#FFFEF8" stroke="#2E6FC2" stroke-width="5"/>
    <rect x="72" y="458" width="398" height="120" rx="18"/>
    <rect x="72" y="646" width="398" height="120" rx="18"/>
  </g>
  <g class="cjk b" font-size="34" text-anchor="middle">
    <text x="271" y="155">网络传输</text>
    <text x="271" y="343">前台推理</text>
    <text x="271" y="531">后台智能体</text>
    <text x="271" y="719">播放</text>
  </g>
  <g fill="none" stroke="#6B6355" stroke-width="3" stroke-linecap="round" marker-end="url(#rp3-ink)">
    <line x1="271" y1="211" x2="271" y2="258"/>
    <line x1="271" y1="399" x2="271" y2="446"/>
    <line x1="271" y1="587" x2="271" y2="634"/>
  </g>

  <!-- Shared control timeline -->
  <rect x="590" y="82" width="96" height="684" rx="28" fill="#4A4438"/>
  <text x="625" y="226" class="cjk b white" font-size="32" writing-mode="vertical-rl" letter-spacing="7">统一交互时间轴</text>
  <text x="666" y="314" class="mono salmon" font-size="30" writing-mode="vertical-rl" letter-spacing="5">共享状态</text>

  <g fill="none" stroke="#6B6355" stroke-width="2.5" stroke-dasharray="7,7" stroke-linecap="round" marker-start="url(#rp3-ink)" marker-end="url(#rp3-ink)">
    <line x1="486" y1="142" x2="574" y2="142"/>
    <line x1="486" y1="330" x2="574" y2="330"/>
    <line x1="486" y1="518" x2="574" y2="518"/>
    <line x1="486" y1="706" x2="574" y2="706"/>
  </g>

  <!-- Rigid and elastic policy capsules -->
  <rect x="710" y="246" width="190" height="166" rx="38" fill="#D9641E"/>
  <text x="805" y="298" class="cjk b white" font-size="30" text-anchor="middle">
    <tspan x="805">刚性：</tspan>
    <tspan x="805" dy="42">前台周期</tspan>
    <tspan x="805" dy="42">· 播放时限</tspan>
  </text>
  <rect x="710" y="456" width="190" height="166" rx="38" fill="#E9E3D4" stroke="#B8AE9A" stroke-width="2.5"/>
  <text x="805" y="508" class="cjk b" font-size="30" text-anchor="middle">
    <tspan x="805">弹性：</tspan>
    <tspan x="805" dy="42">后台调用</tspan>
    <tspan x="805" dy="42">· 结果写回</tspan>
  </text>

  <line x1="72" y1="952" x2="868" y2="952" stroke="#E5DCC8" stroke-width="2" stroke-dasharray="7,9"/>
  <text x="470" y="1034" class="cjk" font-size="30" text-anchor="middle">
    <tspan x="470">刚性负载守时限，弹性负载主动让路</tspan>
    <tspan x="470" dy="48">——一个控制环代替层层留余量</tspan>
  </text>
</svg>
