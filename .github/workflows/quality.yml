name: quality

on:
  push:
  pull_request:

jobs:
  cpu-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # File lists come from git, not from a hand-maintained directory list:
      # a hardcoded list once kept compiling a directory deleted weeks earlier
      # while never covering newly added ones.
      - name: Compile tracked Python (pins and .context excluded)
        run: git ls-files -z '*.py' ':!:third_party/**' ':!:.context/**' | xargs -0 -r python -m compileall -q
      - name: Check tracked shell syntax
        run: git ls-files -z '*.sh' ':!:third_party/**' | xargs -0 -r -n1 bash -n
      - name: Run unit tests
        run: python -m unittest discover -v
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.5"
      - name: Gofmt gate on the conveyor gateway
        run: test -z "$(gofmt -l engines/conveyor/gateway)"
      - name: Build the conveyor gateway
        run: go build ./...
        working-directory: engines/conveyor/gateway
