[project]
name = "omni-anything-research"
version = "0.1.0"
requires-python = ">=3.12"
description = "Reproducible GPU-serving experiments for omni-anything"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
